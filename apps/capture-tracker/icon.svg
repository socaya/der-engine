<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Tracker capture">
  <!-- Purple DHIS2-style tile for tracked entity -->
  <rect x="8" y="8" width="112" height="112" rx="20" fill="#9B51E0"/>
  <!-- Person silhouette -->
  <circle cx="54" cy="48" r="14" fill="#ffffff"/>
  <path d="M30 94a24 24 0 0 1 48 0v4h-48z" fill="#ffffff"/>
  <!-- Tracking arrow + waypoint -->
  <path d="M86 56l14 14-14 14" fill="none" stroke="#F2C94C"
        stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M74 70h22" stroke="#F2C94C" stroke-width="4"
        stroke-linecap="round"/>
  <!-- Status pulse dot -->
  <circle cx="96" cy="30" r="8" fill="#27AE60"/>
  <circle cx="96" cy="30" r="3" fill="#ffffff"/>
</svg>
