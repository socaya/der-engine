<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Data entry">
  <!-- Teal DHIS2-style tile for aggregate data entry -->
  <rect x="8" y="8" width="112" height="112" rx="20" fill="#1A9988"/>
  <!-- Table outline -->
  <rect x="28" y="36" width="72" height="56" rx="4"
        fill="none" stroke="#ffffff" stroke-width="4"/>
  <!-- Header band -->
  <rect x="28" y="36" width="72" height="14" rx="4" fill="#ffffff" opacity="0.35"/>
  <path d="M28 50h72" stroke="#ffffff" stroke-width="2.5"/>
  <!-- Column dividers -->
  <path d="M52 36v56" stroke="#ffffff" stroke-width="2.5"/>
  <path d="M76 36v56" stroke="#ffffff" stroke-width="2.5"/>
  <!-- Row dividers -->
  <path d="M28 64h72" stroke="#ffffff" stroke-width="2.5"/>
  <path d="M28 78h72" stroke="#ffffff" stroke-width="2.5"/>
  <!-- Filled check cell -->
  <path d="M83 70l4 4 7-7" stroke="#F2C94C" stroke-width="3.5"
        fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
