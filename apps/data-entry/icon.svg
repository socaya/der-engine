<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Data Entry">
  <defs>
    <linearGradient id="deTile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1FA896"/>
      <stop offset="1" stop-color="#0D7A6D"/>
    </linearGradient>
    <linearGradient id="deSheet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EDF5F3"/>
    </linearGradient>
    <linearGradient id="dePencil" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F7B500"/>
      <stop offset="1" stop-color="#F28F00"/>
    </linearGradient>
    <filter id="deShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3"
                    flood-color="#063B35" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- Rounded tile with diagonal gradient -->
  <rect x="6" y="6" width="116" height="116" rx="24" fill="url(#deTile)"/>
  <!-- Subtle top highlight for depth -->
  <rect x="6" y="6" width="116" height="40" rx="24" fill="#FFFFFF" opacity="0.08"/>

  <!-- Form sheet -->
  <g filter="url(#deShadow)">
    <rect x="30" y="26" width="68" height="84" rx="8" fill="url(#deSheet)"/>
  </g>
  <!-- Header band -->
  <rect x="30" y="26" width="68" height="18" rx="8" fill="#0A5F55"/>
  <rect x="30" y="38" width="68" height="6" fill="#0A5F55"/>
  <!-- Title bars on header -->
  <rect x="38" y="33" width="34" height="3" rx="1.5" fill="#FFFFFF" opacity="0.85"/>

  <!-- Row 1: label + filled green cell (success tick) -->
  <rect x="38" y="52" width="26" height="4" rx="2" fill="#A9BCB8"/>
  <rect x="72" y="50" width="18" height="10" rx="2" fill="#E6F6EC"/>
  <path d="M76 55l3 3 6-6" stroke="#1E8E4A" stroke-width="2.2"
        fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Row 2: label + numeric value -->
  <rect x="38" y="68" width="26" height="4" rx="2" fill="#A9BCB8"/>
  <rect x="72" y="66" width="18" height="10" rx="2" fill="#E8F0FA"/>
  <text x="81" y="74.5" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="8.5" font-weight="700" fill="#0A5F55"
        text-anchor="middle">124</text>

  <!-- Row 3: label + required/empty attention -->
  <rect x="38" y="84" width="26" height="4" rx="2" fill="#A9BCB8"/>
  <rect x="72" y="82" width="18" height="10" rx="2" fill="#FFF3E1"
        stroke="#F7B500" stroke-width="1"/>
  <circle cx="81" cy="87" r="1.8" fill="#C97700"/>

  <!-- Pencil — overlaid on bottom-right corner writing -->
  <g transform="translate(92 92) rotate(-38)" filter="url(#deShadow)">
    <!-- Body -->
    <rect x="-28" y="-5" width="24" height="10" rx="2" fill="url(#dePencil)"/>
    <!-- Ferrule -->
    <rect x="-4" y="-5" width="4" height="10" fill="#D9B6B6"/>
    <!-- Eraser -->
    <rect x="0" y="-5" width="4" height="10" rx="2" fill="#E96B6B"/>
    <!-- Tip -->
    <polygon points="-32,-5 -38,0 -32,5" fill="#F4E4C1"/>
    <polygon points="-34,-2 -38,0 -34,2" fill="#2B2D2E"/>
  </g>
</svg>
