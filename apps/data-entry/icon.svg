<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Data entry">
  <defs>
    <linearGradient id="deBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1A9988"/>
      <stop offset="1" stop-color="#0E6D62"/>
    </linearGradient>
    <linearGradient id="deSheet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#F3F7F6"/>
    </linearGradient>
    <filter id="deShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Rounded tile background with subtle vertical gradient -->
  <rect x="8" y="8" width="112" height="112" rx="22" fill="url(#deBg)"/>

  <!-- Back sheet (offset for depth) -->
  <rect x="34" y="28" width="68" height="78" rx="5"
        fill="#ffffff" opacity="0.35"/>

  <!-- Primary form sheet with soft shadow -->
  <g filter="url(#deShadow)">
    <rect x="28" y="34" width="68" height="78" rx="6" fill="url(#deSheet)"/>
  </g>

  <!-- Form header band -->
  <rect x="28" y="34" width="68" height="14" rx="6" fill="#0E6D62"/>
  <rect x="34" y="40" width="34" height="3" rx="1.5" fill="#ffffff" opacity="0.85"/>

  <!-- Table grid lines -->
  <g stroke="#CBE3DF" stroke-width="1.5">
    <line x1="28" y1="62" x2="96" y2="62"/>
    <line x1="28" y1="76" x2="96" y2="76"/>
    <line x1="28" y1="90" x2="96" y2="90"/>
    <line x1="52" y1="48" x2="52" y2="104"/>
    <line x1="74" y1="48" x2="74" y2="104"/>
  </g>

  <!-- Filled "good" cell (green check) -->
  <rect x="52" y="48" width="22" height="14" fill="#E5F4EA"/>
  <path d="M58 55l3 3 6-6" stroke="#1B8243" stroke-width="2.2"
        fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Numeric cell with value -->
  <rect x="74" y="62" width="22" height="14" fill="#E6F1FB"/>
  <text x="85" y="73" font-family="system-ui, -apple-system, sans-serif"
        font-size="10" font-weight="700" fill="#0E6D62"
        text-anchor="middle">42</text>

  <!-- Attention cell (empty / required) -->
  <rect x="52" y="90" width="22" height="14" fill="#FFF1DC"/>
  <circle cx="63" cy="97" r="1.8" fill="#C6680A"/>

  <!-- Pencil (DHIS2 entry affordance) -->
  <g transform="translate(78 82) rotate(-35)">
    <rect x="0" y="0" width="22" height="7" rx="1.5" fill="#F2C94C"/>
    <rect x="0" y="0" width="5" height="7" fill="#F2A33E"/>
    <polygon points="22,0 28,3.5 22,7" fill="#2A3447"/>
  </g>
</svg>
