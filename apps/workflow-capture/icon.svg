<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Workflow capture">
  <!-- DHIS2 blue tile for workflow -->
  <rect x="8" y="8" width="112" height="112" rx="20" fill="#147CD7"/>
  <!-- Three workflow nodes connected in a Z -->
  <rect x="22" y="28" width="42" height="24" rx="4" fill="#ffffff"/>
  <rect x="64" y="52" width="42" height="24" rx="4" fill="#F2C94C"/>
  <rect x="22" y="76" width="42" height="24" rx="4" fill="#27AE60"/>
  <!-- Connector 1: top to middle -->
  <path d="M64 40h8a8 8 0 0 1 8 8v4"
        fill="none" stroke="#ffffff" stroke-width="3.5"
        stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="80,58 75,53 85,53" fill="#ffffff"/>
  <!-- Connector 2: middle to bottom -->
  <path d="M64 64h-8a8 8 0 0 0-8 8v4"
        fill="none" stroke="#ffffff" stroke-width="3.5"
        stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="48,82 43,77 53,77" fill="#ffffff"/>
</svg>
