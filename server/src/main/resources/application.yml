# DER coordination service — Phase 02 defaults.
#
# Datasource and Flyway are now active. All sensitive values come from the
# environment (see .env.local.example at the repo root). Running without
# DER_DB_URL is still supported for pure-unit test contexts because the
# datasource bean is only required when any security component is wired
# (which happens in production and @SpringBootTest).
server:
  port: ${DER_PORT:8085}
spring:
  application:
    name: der-server

  datasource:
    url: ${DER_DB_URL:}
    username: ${DER_DB_USERNAME:}
    password: ${DER_DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DER_DB_POOL_MAX:10}
      pool-name: der-primary

  flyway:
    enabled: ${DER_FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    baseline-on-migrate: true
    schemas: der
    default-schema: der

  # Spring Security starter is active. Phase 02 configures a custom
  # SecurityFilterChain in ug.ac.mak.der.security.SecurityConfig.

  # Phase 05 (ADR-0008) Quartz Postgres JobStore. Quartz auto-creates its
  # qrtz_* tables under the der schema on first boot.
  quartz:
    job-store-type: ${DER_QUARTZ_STORE:jdbc}
    jdbc:
      initialize-schema: ${DER_QUARTZ_SCHEMA_INIT:always}
    properties:
      org:
        quartz:
          scheduler:
            instanceName: DerScheduler
            instanceId: AUTO
          jobStore:
            class: org.springframework.scheduling.quartz.LocalDataSourceJobStore
            driverDelegateClass: org.quartz.impl.jdbcjobstore.PostgreSQLDelegate
            tablePrefix: der.qrtz_
            isClustered: false
            useProperties: false
          threadPool:
            class: org.quartz.simpl.SimpleThreadPool
            threadCount: 4

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: never
    prometheus:
      enabled: true
  metrics:
    tags:
      application: der-server
    distribution:
      percentiles-histogram:
        http.server.requests: true

# §2 Observability — structured JSON logs. Flip DER_LOG_FORMAT=plain
# in dev; keep json in pilot / production so log aggregators (Loki,
# Elasticsearch) can parse without custom codecs.
logging:
  pattern:
    console: "${DER_LOG_PATTERN:%d{ISO8601} %-5level [%X{traceId:-},%X{spanId:-}] %logger{36} - %msg%n}"

# DHIS2 adapter — Phase 01 (ADR-0002, ADR-0003).
der:
  dhis2:
    central:
      base-url: ${DER_DHIS2_CENTRAL_URL:}
      username: ${DER_DHIS2_USER:}
      password: ${DER_DHIS2_PASSWORD:}
      connect-timeout-millis: ${DER_DHIS2_TIMEOUT_MILLIS:10000}
    compatibility:
      pinned-version: ${DER_DHIS2_PINNED_VERSION:2.44-SNAPSHOT}
      allow-mismatch: ${DER_DHIS2_ALLOW_MISMATCH:false}

  # Phase 02 security + session configuration.
  security:
    session:
      ttl: ${DER_SESSION_TTL:PT4H}
      cookie-name: ${DER_SESSION_COOKIE_NAME:DER_SESSION}
      cookie-secure: ${DER_SESSION_COOKIE_SECURE:false}
      cookie-same-site: ${DER_SESSION_COOKIE_SAMESITE:Strict}
      secret: ${DER_SESSION_SECRET:}
    sign-in:
      rate-limit-per-ip-per-minute: ${DER_SIGN_IN_LIMIT_IP:30}
      rate-limit-per-user-per-minute: ${DER_SIGN_IN_LIMIT_USER:10}
    bootstrap:
      admin-username: ${DER_BOOTSTRAP_ADMIN_USERNAME:}
      admin-password: ${DER_BOOTSTRAP_ADMIN_PASSWORD:}

  # Phase 05 (ADR-0008) scheduler cadences.
  sync:
    metadata:
      cron: ${DER_SYNC_METADATA_CRON:0 0 */4 * * ?}
    compat:
      cron: ${DER_SYNC_COMPAT_CRON:0 0 3 * * ?}
    drift:
      cron: ${DER_SYNC_DRIFT_CRON:0 10 */4 * * ?}
    enabled: ${DER_SYNC_ENABLED:true}
