# DER coordination service — Phase 01 defaults.
#
# Phase 01 wires up the DHIS2 adapter and version guard but still ships without
# a live PostgreSQL dependency: Flyway and the JDBC starter remain on the
# classpath so Phase 02 migrations drop in without churn, but autoconfiguration
# is disabled at this phase so the boot path stays honest.
server:
  port: ${DER_PORT:8085}
spring:
  application:
    name: der-server
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration
      - org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

# DHIS2 adapter — Phase 01 (ADR-0002, ADR-0003).
# The pinned version MUST match /api/system/info.version prefix on the central.
# `allow-mismatch=true` is a development override and MUST NOT be set in a
# released configuration.
der:
  dhis2:
    central:
      base-url: ${DER_DHIS2_CENTRAL_URL:}
      username: ${DER_DHIS2_USER:}
      password: ${DER_DHIS2_PASSWORD:}
      connect-timeout-millis: 10000
    compatibility:
      pinned-version: 2.44-SNAPSHOT
      allow-mismatch: false
