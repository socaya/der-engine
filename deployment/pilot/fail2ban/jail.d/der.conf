# fail2ban jail for DER brute-force protection.
#
# Install to /etc/fail2ban/jail.d/der.conf.  After editing:
#   sudo systemctl restart fail2ban
#   sudo fail2ban-client status der-auth
#
# Thresholds are deliberately strict for a facility edge: 5 failures
# in 10 min triggers a 30-min ban. Tune `maxretry`, `findtime`, and
# `bantime` for your deployment risk tolerance.

[der-auth]
enabled   = true
port      = http,https,8085,8443
filter    = der-auth
logpath   = /var/log/der/server.log
maxretry  = 5
findtime  = 10m
bantime   = 30m
action    = iptables-multiport[name=der-auth, port="8085,8443", protocol=tcp]

# ── Optional: a dedicated jail for peer / messaging admin APIs so a
# compromised device can't brute-force the admin surface indefinitely.
[der-admin]
enabled   = false
port      = http,https,8085,8443
filter    = der-auth
logpath   = /var/log/der/server.log
maxretry  = 3
findtime  = 5m
bantime   = 2h
