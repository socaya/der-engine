# fail2ban filter for DER authentication failures.
#
# DER emits a structured log line for every failed sign-in attempt.
# The regex captures the client IP so fail2ban can ban the attacker
# after N failures in a window.
#
# Install to /etc/fail2ban/filter.d/der-auth.conf; the jail config in
# jail.d/der.conf points at this filter.

[Definition]

# Example DER log line:
# 2026-10-29T20:12:34.567+03:00 WARN  [abc123,def456] u.a.m.der.security.AuthController - AUTH_FAIL username=admin ip=192.168.1.42 reason=invalid_password
failregex = ^.* WARN  .* AUTH_FAIL .* ip=<HOST> .*$
ignoreregex =

datepattern = ^%%Y-%%m-%%d.%%H:%%M:%%S
