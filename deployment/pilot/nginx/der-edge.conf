# DER pilot reverse-proxy (ADR-0004 hybrid topology, ADR-0014 pilot).
#
# Drop into /etc/nginx/sites-available/der-edge.conf and symlink into
# /etc/nginx/sites-enabled/, then: systemctl reload nginx
#
# TLS termination is operator responsibility (certbot + the deployment/tls
# runbook). This file ships the LAN-HTTP server block; the TLS block is a
# straightforward addition — see docs/operations/pilot-runbook.md §6.

upstream der_server {
    server 127.0.0.1:8085;
    keepalive 32;
}

server {
    listen 8080 default_server;
    server_name _;

    client_max_body_size 64m;

    # Device client SPA.
    location / {
        root /opt/der/client/dist;
        try_files $uri /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Admin UI.
    location /admin/ {
        alias /opt/der/admin-ui/dist/;
        try_files $uri $uri/ /admin/index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # DHIS2 Web API emulator (ADR-0004).
    location /api/ {
        proxy_pass http://der_server;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # Backup download streams; keep the response read timeout generous.
        proxy_read_timeout 600s;
    }

    # DER coordination surface.
    location /edge-api/ {
        proxy_pass http://der_server;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 600s;
    }

    # ADR-0005 custom-app hosting.
    location /dhis-web- {
        proxy_pass http://der_server;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # Minimal access log — journald collects both via nginx's default logging.
    access_log /var/log/nginx/der-edge.access.log;
    error_log  /var/log/nginx/der-edge.error.log warn;
}
